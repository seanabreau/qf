<svg xmlns="http://www.w3.org/2000/svg" width="720" height="402" viewBox="0 0 720 402" role="img" aria-labelledby="title desc">
<title id="title">Benchmark time and memory</title>
<desc id="desc">Median elapsed time and median peak process-tree memory. Each pair of bars starts at zero and shares a scale. Lower values are better.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#22262b" style="font-variant-numeric:tabular-nums">
<text x="16" y="25" fill="#59636e">Workload</text>
<text x="226" y="25" fill="#59636e">Median time</text>
<text x="473" y="25" fill="#59636e">Peak memory</text>
<path d="M16 39.5H704" stroke="#dce0e3"/>
<text x="16" y="71" font-size="23" font-weight="600">Packaging</text>
<text x="16" y="92" fill="#59636e">Parallel tests</text>
<text x="16" y="119" >vfy</text>
<text x="16" y="141" >pytest-xdist</text>
<text x="226" y="71" font-weight="600">1.9× faster</text>
<rect x="226" y="111" width="68.76" height="6" rx="3" fill="#cb603d"/>
<text x="432" y="119" text-anchor="end">11.61 s</text>
<rect x="226" y="133" width="130.00" height="6" rx="3" fill="#919aa3"/>
<text x="432" y="141" text-anchor="end">21.94 s</text>
<text x="473" y="71" font-weight="600">65% less memory</text>
<rect x="473" y="111" width="51.38" height="6" rx="3" fill="#cb603d"/>
<text x="704" y="119" text-anchor="end">582 MiB</text>
<rect x="473" y="133" width="145.00" height="6" rx="3" fill="#919aa3"/>
<text x="704" y="141" text-anchor="end">1,642 MiB</text>
<path d="M16 158.5H704" stroke="#dce0e3"/>
<text x="16" y="189" font-size="23" font-weight="600">Rich</text>
<text x="16" y="210" fill="#59636e">Affected-test selection</text>
<text x="16" y="237" >vfy</text>
<text x="16" y="259" >pytest-testmon</text>
<text x="226" y="189" font-weight="600">2.0× faster</text>
<rect x="226" y="229" width="65.15" height="6" rx="3" fill="#cb603d"/>
<text x="432" y="237" text-anchor="end">0.36 s</text>
<rect x="226" y="251" width="130.00" height="6" rx="3" fill="#919aa3"/>
<text x="432" y="259" text-anchor="end">0.71 s</text>
<text x="473" y="189" font-weight="600">34% more memory</text>
<rect x="473" y="229" width="145.00" height="6" rx="3" fill="#cb603d"/>
<text x="704" y="237" text-anchor="end">60 MiB</text>
<rect x="473" y="251" width="108.44" height="6" rx="3" fill="#919aa3"/>
<text x="704" y="259" text-anchor="end">45 MiB</text>
<path d="M16 276.5H704" stroke="#dce0e3"/>
<text x="16" y="307" font-size="23" font-weight="600">flake8-simplify</text>
<text x="16" y="328" fill="#59636e">Mutation testing</text>
<text x="16" y="355" >vfy</text>
<text x="16" y="377" >mutmut</text>
<text x="226" y="307" font-weight="600">19.0× faster</text>
<rect x="226" y="347" width="6.85" height="6" rx="3" fill="#cb603d"/>
<text x="432" y="355" text-anchor="end">1.41 s</text>
<rect x="226" y="369" width="130.00" height="6" rx="3" fill="#919aa3"/>
<text x="432" y="377" text-anchor="end">26.76 s</text>
<text x="473" y="307" font-weight="600">50% less memory</text>
<rect x="473" y="347" width="73.11" height="6" rx="3" fill="#cb603d"/>
<text x="704" y="355" text-anchor="end">69 MiB</text>
<rect x="473" y="369" width="145.00" height="6" rx="3" fill="#919aa3"/>
<text x="704" y="377" text-anchor="end">137 MiB</text>
</g></svg>
